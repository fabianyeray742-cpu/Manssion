services:
  - type: web
    name: la-mansion-qr
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/me
    disk:
      name: la-mansion-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOGIN_USER
        value: MANSSION
      - key: LOGIN_PASSWORD
        value: "2020"
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_FILE
        value: /var/data/data.sqlite
