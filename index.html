<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100d12">
    <title>LA MANSION · Control de acceso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
    <style>
        :root {--bg:#100d12;--panel:#1a151d;--panel-border:#2e2532;--orange:#f97316;--orange-hover:#ea580c;--text:#f3f4f6;--muted:#9ca3af;}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;}
        h1,h2,h3,.brand{font-family:'Cinzel',serif;}
        .login-wrap{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--panel-border);border-radius:16px;padding:32px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.5);display:none;}
        .login-wrap.active{display:block;}
        .app-wrap{width:100%;max-width:600px;display:none;}
        .app-header{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--panel-border);padding:16px 24px;border-radius:12px;margin-bottom:20px;}
        .tabs{display:flex;gap:8px;margin-bottom:20px;}
        .tab-btn{flex:1;background:var(--panel);border:1px solid var(--panel-border);color:var(--muted);padding:12px;border-radius:8px;cursor:pointer;font-weight:600;transition:0.2s;}
        .tab-btn.active{background:var(--orange);color:#fff;border-color:var(--orange);}
        .panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;padding:24px;display:none;}
        .panel.active{display:block;}
        .field{margin-bottom:16px;text-align:left;}
        label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
        input,select{width:100%;background:#100d12;border:1px solid var(--panel-border);color:var(--text);padding:12px;border-radius:8px;font-size:15px;}
        input:focus,select:focus{outline:none;border-color:var(--orange);}
        .btn-primary{width:100%;background:var(--orange);color:#fff;border:none;padding:14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:16px;transition:0.2s;}
        .btn-primary:hover{background:var(--orange-hover);}
        .error{color:#ef4444;font-size:13px;margin-top:10px;}
        .ticket-card{background:#100d12;border:1px solid var(--panel-border);border-radius:12px;padding:20px;text-align:center;margin-top:20px;}
        .ticket-card img{margin-bottom:12px;border-radius:8px;background:#fff;padding:8px;}
        .btn-download{display:inline-block;background:#374151;color:#fff;text-decoration:none;padding:8px 16px;border-radius:6px;font-size:14px;margin-top:12px;}
        .btn-download:hover{background:#4b5563;}
        .list-item{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--panel-border);font-size:14px;}
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login" class="login-wrap active">
        <h2 style="color:var(--orange);margin-bottom:8px;">LA MANSION</h2>
        <p style="color:var(--muted);font-size:14px;margin-bottom:24px;">Control de acceso exclusivo</p>
        <form id="loginForm">
            <div class="field">
                <label>Usuario</label>
                <input type="text" id="username" required placeholder="Escribe tu usuario">
            </div>
            <div class="field">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="Escribe tu contraseña">
            </div>
            <button type="submit" class="btn-primary">Ingresar</button>
            <div id="loginError" class="error"></div>
        </form>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app" class="app-wrap">
        <div class="app-header">
            <h3 style="margin:0;color:var(--orange);">LA MANSION</h3>
            <button id="logout" style="background:none;border:1px solid var(--panel-border);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;">Salir</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-target="panel-create">Crear QR</button>
            <button class="tab-btn" data-target="panel-list" onclick="loadList()">Ver Entradas</button>
        </div>

        <!-- Panel Crear -->
        <div id="panel-create" class="panel active">
            <h3 style="margin-top:0;">Generar Nueva Entrada</h3>
            <form id="generateForm">
                <div class="field">
                    <label>Nombre del Invitado</label>
                    <input type="text" id="guest" placeholder="Ej. Juan Pérez">
                </div>
                <div class="field">
                    <label>Tipo de Entrada</label>
                    <select id="ticketType">
                        <option value="General">General</option>
                        <option value="VIP">VIP</option>
                    </select>
                </div>
                <div class="field">
                    <label>Cantidad</label>
                    <input type="number" id="quantity" value="1" min="1" max="50">
                </div>
                <button type="submit" class="btn-primary">Generar Código(s)</button>
            </form>
            <div id="resultContainer"></div>
        </div>

        <!-- Panel Listar -->
        <div id="panel-list" class="panel">
            <h3 style="margin-top:0;">Entradas Registradas</h3>
            <div id="ticketList" style="max-height:350px;overflow-y:auto;">
                <p style="color:var(--muted);text-align:center;">Cargando lista...</p>
            </div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);

        async function api(url, options={}) {
            const r = await fetch(url, {...options, headers: {'Content-Type': 'application/json', ...options.headers}});
            const data = await r.json().catch(() => ({}));
            if(!r.ok) throw new Error(data.error || 'Error en la petición');
            return data;
        }

        function showApp(){ 
            $('login').classList.remove('active');$('app').style.display='block'; 
        }

        async function checkSession(){
            try {
                const res = await api('/api/tickets');
                if(res && res.tickets) showApp();
            } catch(e) {
                $('login').classList.add('active');$('app').style.display='none';
            }
        }

        $('loginForm').addEventListener('submit', async e => {
            e.preventDefault();
            try {
                const username = $('username').value;
                const password = $('password').value;
                await api('/api/login', {method:'POST', body: JSON.stringify({username, password})});
                showApp();
            } catch(err) {
                $('loginError').textContent = err.message;
            }
        });

        $('logout').addEventListener('click', async () => {
            await api('/api/logout', {method:'POST'});
            location.reload();
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                $(btn.dataset.target).classList.add('active');
            });
        });

        $('generateForm').addEventListener('submit', async e => {
            e.preventDefault();
            const guest = $('guest').value;
            const ticket_type = $('ticketType').value;
            const quantity = $('quantity').value;
            try {
                const res = await api('/api/tickets', {method:'POST', body: JSON.stringify({guest, ticket_type, quantity})});
                if(res.tickets && res.tickets.length > 0) {
                    renderResult(res.tickets);
                }
            } catch(err) {
                alert(err.message);
            }
        });

        function renderResult(tickets) {
            const container = $('resultContainer');
            container.innerHTML = '';
            tickets.forEach(ticket => {
                const card = document.createElement('div');
                card.className = 'ticket-card';
                card.innerHTML = `
                    <img src="${ticket.qr_image}" alt="Código QR" style="width:180px;height:180px;"/>
                    <h4 style="margin:8px 0 4px 0;">${ticket.guest || 'Invitado'}</h4>
                    <p style="margin:0;color:var(--muted);font-size:13px;">${ticket.ticket_type} · ${ticket.code}</p>
                    <br>
                    <a href="${ticket.qr_image}" download="QR_${ticket.code}.png" class="btn-download">Descargar QR</a>
                `;
                container.appendChild(card);
            });
        }

        async function loadList() {
            try {
                const res = await api('/api/tickets');
                const listDiv = $('ticketList');
                listDiv.innerHTML = '';
                if(res.tickets && res.tickets.length > 0) {
                    res.tickets.forEach(t => {
                        const item = document.createElement('div');
                        item.className = 'list-item';
                        item.innerHTML = `<span><b>${t.guest}</b> (${t.ticket_type})<br><small style="color:var(--muted);">${t.code}</small></span> <span style="color:${t.used_at ? '#ef4444':'#10b981'};font-weight:600;">${t.used_at ? 'Usado' : 'Disponible'}</span>`;
                        listDiv.appendChild(item);
                    });
                } else {
                    listDiv.innerHTML = '<p style="color:var(--muted);text-align:center;">No hay entradas creadas aún.</p>';
                }
            } catch(e) { 
                console.error(e); 
            }
        }

        checkSession();
    </script>
</body>
</html>
